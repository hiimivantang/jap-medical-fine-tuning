doc_type_styles:
  外来診療録: "外来診療録。SOAP形式（S: 主観的情報、O: 客観的情報、A: 評価、P: 計画）で、簡潔な臨床的記述。"
  入院時記録: "入院時記録。主訴、現病歴、既往歴、家族歴、内服薬、アレルギー、入院時現症、入院時の評価をまとめた記録。"
  退院時サマリー: "退院時サマリー。入院経過、治療経過の概要、退院時の状態、退院時処方、今後の方針を記載した要約。"
  紹介状: "診療情報提供書（紹介状）。紹介先の先生への丁寧な文体（「ご高診のほどよろしくお願い申し上げます」等）で紹介目的と経過を記載。"
  看護記録: "看護記録。看護師の観察（バイタルサイン、患者の訴え、看護ケア、患者の反応）を時系列で記載。"
  検査・画像所見報告書: "検査・画像所見報告書。検査や画像（CT、MRI、エコー、内視鏡など）の所見と診断（印象）を記載する報告書形式。"
