# Dataset preparation config (used by `jmedft data synth`, `jmedft data build`, `jmedft data validate`).
seed: 20261019
term_inventory: experiments/01_finetuning/configs/term_inventory.yaml
# Fraction of each term category reserved for test notes only (unseen surface strings at test time).
heldout_term_fraction: 0.25

generators:
  qwen:
    name: qwen3.8-27b
    hf_id: Qwen/Qwen3.8-27B-FP8
    revision: 017b9c7af6b5689d5dd426a76e0bc077eb5ca20a
    license: apache-2.0
    base_url: http://127.0.0.1:8200/v1
    temperature: 0.8
    top_p: 0.95
    max_tokens: 1200
    concurrency: 64
  nemotron:
    name: nemotron-3.5-lightning
    hf_id: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
    revision: 6dbbd757ea75a8ece6e0702872e3ae53f9987728
    license: openmdw-1.1
    base_url: http://127.0.0.1:8300/v1
    temperature: 0.8
    top_p: 0.95
    max_tokens: 1200
    concurrency: 64

# Number of note specs to request per split. Some generated notes fail validation and are dropped;
# the achieved counts are recorded in data/processed/split_stats.json.
synthetic:
  train: {generator: qwen, n_specs: 1800, term_pool: train}
  val: {generator: qwen, n_specs: 180, term_pool: train}
  test_synth: {generator: qwen, n_specs: 300, term_pool: mixed}
  # Nemotron follows the long spec less reliably (~25% acceptance with 6 attempts, measured on 40 specs),
  # so more specs and attempts are requested; accepted notes skew toward simpler specs (see report).
  test_xgen: {generator: nemotron, n_specs: 1000, term_pool: mixed, retries: 5}
  # In "mixed" specs, each entity category draws from the held-out pool with this probability.
  mixed_heldout_prob: 0.5

spec_sampling:
  age_range: [18, 92]
  p_age_missing: 0.08
  p_sex_missing: 0.08
  n_symptoms: [1, 4]
  n_negated_symptoms: [0, 2]
  n_past_history: [0, 3]
  n_family_history: [0, 2]
  n_medications: [0, 4]
  n_allergies: [0, 2]
  n_diagnoses: [0, 2]
  n_suspected: [0, 2]
  p_chief_complaint: 0.85

validation:
  min_chars: 80
  max_chars: 1400
  # Negation cue must appear within this many characters after a negated symptom mention.
  negation_window: 20
  negation_cues: ["なし", "認めない", "認めず", "みられない", "見られない", "否定", "ない", "訴えない", "無し", "（－）", "(-)"]
  # Test notes whose character 5-gram Jaccard with any train note reaches this value are dropped.
  near_dup_jaccard: 0.6

real_sources:
  # Leakage rule: drop any document whose 5-gram containment with any JMED-LLM eval document >= threshold.
  jmed_llm_containment_threshold: 0.2
  medtxt_cr_ja: data/raw/real_mednlp/extracted/MedTxt-CR-JA-training-pub.xml
  # MedTxt-RR training reports describe the same cases as JMED-LLM radiology items: excluded entirely.
  medtxt_rr_ja_test: data/raw/real_mednlp/extracted/MedTxt-RR-JA-test-answer-pub.xml
  jmed_llm_dir: data/raw/jmed_llm

external_eval:
  jmed_llm_dir: data/raw/jmed_llm
  jglue_dir: data/raw/jglue

output_dir: data/processed
